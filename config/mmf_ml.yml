# MMF-ml: multilayer moving frames. MMF-4h (mmf_dti_hold) on the field of LIFTS
# instead of the principal eigenvector. Each bundle through a voxel is one layer,
# a sheet on M = Omega x RP^2 (positions x fibre directions), deconvolved from the
# raw signal by nim_lift_field. Where bundles cross, every layer keeps its own frame
# and its own connection 1-form, and a tract reads only the layer of its heading.
# It coasts where its own layer is missing (the read weight is below mmf.hold_min).
# docs/MMF_ML.md has the definitions and the scores against the ISMRM 2015 ground truth.
#
# ./bin/run_tractography.sh mmf_ml --score
#
# These are exactly the settings of the scored MMF-4h runs, plus field: lift and the
# lift settings that were best on ISMRM 2015. The lifts are cached next to the nim
# (<nim>_lift_<hash>.mat), so only the first run builds them.
# Canonical nested schema. Only non-default values appear here;
# everything else comes from nim_config_schema defaults.
# Any parameter can be overridden on the CLI: --set <path>=<value>

tractography:
  algorithm: mmf
  field: lift             # the layers (lifts) of nim_lift_field, not v1
  seeding:
    density: 1
    fa_min: 0.1
  integrator:
    method: rk4
    step: 0.2
  interpolation:
    method: spline        # C2 kernel: the connection is a derivative of the field
  termination:
    angle_max: 0          # off: the scheme's exit test takes its place
    max_arc: 400
    fa_min: 0.10
  mmf:
    mode: adaptive
    reanchor_tol: 0.2
    hold: hold            # coast where the tract's own layer is not read
    hold_min: 0.15        # floor of the READ WEIGHT of the layer (not of CL as in MMF-4h)
    exit_tol: 1.2
  lift:
    sparsity: 0.03        # prior of few layers, mu in ||K a + K_iso c - y||^2 + mu (sum a)^2
    smooth: 0             # no smoothing along the fibres (it bends curved bundles)
    stencil: fd4          # the nodal derivative of field: dti, along each layer's branch
    read_min: 0.125       # least share of the trilinear weight on corners that carry the layer
    read_tol: 30          # degrees between a corner's layer and the heading
