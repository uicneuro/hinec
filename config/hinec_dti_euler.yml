# HINEC interpolated DTI — EULER integration (order 1) + trilinear interpolation.
# The lowest-order interpolated tracker: a comparison point between pure FACT
# (standard_dti) and the higher-order hinec integrators.
# (Formerly euler_interpolated.yml.)
# 
# ./bin/run_tractography.sh hinec_dti_euler --score
# 
# Canonical nested schema. Only non-default values appear here;
# everything else comes from nim_config_schema defaults.
# Any parameter can be overridden on the CLI: --set <path>=<value>

tractography:
  act: true
  integrator:
    method: euler
    step: 0.5
  seeding:
    density: 4
  termination:
    fa_min: 0.2
    angle_max: 70
    min_arc: 45

