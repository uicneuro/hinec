# HINEC interpolated DTI — FAST exploration: RK2 (order 2) + trilinear, coarse
# steps and sparse seeding for quick parameter screening (3-5x faster than default).
# (Formerly fast_exploration.yml.)
# 
# ./bin/run_tractography.sh hinec_dti_fast --score
# 
# Canonical nested schema. Only non-default values appear here;
# everything else comes from nim_config_schema defaults.
# Any parameter can be overridden on the CLI: --set <path>=<value>

tractography:
  act: true
  integrator:
    method: rk2
    step: 0.3
  seeding:
    density: 2
  termination:
    angle_max: 150
    fa_min: 0.2
    max_arc: 150
    min_arc: 40

