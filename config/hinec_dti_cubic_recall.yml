# HINEC interpolated DTI — CUBIC interpolation tuned for RECALL / COVERAGE.
# (Formerly max_coverage.yml.)  Run: ./bin/run_tractography.sh hinec_dti_cubic_recall --score
# 
# Tests the OL/OR diagnosis: HINEC is overlap-limited (OL 0.27) with huge
# overreach headroom (OR 0.11 vs SOTA's 0.60). This config deliberately trades
# precision for coverage to push recall up, while keeping the strongest
# deterministic integrator (RKF45). Same model (single-tensor) and same
# determinism — only the tracking aggressiveness changes vs hinec_dti_cubic:
# - densest seeding (seed_density 8)
# - aggressive termination (fa_min 0.05, angle_max 300 deg/voxel, min_arc 15)
# 
# Canonical nested schema. Only non-default values appear here;
# everything else comes from nim_config_schema defaults.
# Any parameter can be overridden on the CLI: --set <path>=<value>

tractography:
  integrator:
    method: rkf45
  interpolation:
    method: cubic
  termination:
    fa_min: 0.05
    angle_max: 300
    max_arc: 300

