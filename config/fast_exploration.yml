# HINEC Fast Exploration Configuration
# For quick exploratory analysis and parameter testing
# Expected runtime: 3-5x faster than default

preprocessing:
  run_denoising: true
  denoise_method: 'dwidenoise'
  run_motion_correction: true
  run_eddy: true
  improve_mask: true
  atlas_type: 'jhu'

tractography:
  algorithm: 'hinec'

  # RK2 for speed with reasonable accuracy
  integration_order: 2
  interp_method: 'trilinear'
  adaptive_step: false
  step_size: 0.3          # Larger steps for faster tracking

  # Moderate seeding density
  seed_density: 2
  seed_strategy: 'uniform'

  # Looser termination criteria for faster results
  termination_fa: 0.2     # Higher threshold (stops earlier)
  angle_thresh: 45        # More permissive curvature
  max_steps: 500          # Fewer steps allowed
  min_length: 40          # Longer minimum (filters more)

  # ACT
  act_enabled: true
  enable_diagnostics: true
