# ismrm2015 — dataset/preprocessing config for the ISMRM 2015 Tractography Challenge.
# Dataset: 2 mm isotropic, 32 dirs, b=1000. Builds the nim via run_hinec.sh; the
# tractography block below is the initial-pass default (mirrors hinec_dti) — iterate/tune
# per experiment with run_tractography.sh on the built nim.
# 
# Pair with the data layout in data/ismrm2015/ — see data/ismrm2015/README.md. Scoring with
# scilpy (Renauld 2023) expects streamlines in RAS world (mm); run scripts/hinec_to_trk.py
# --space rasmm after the pipeline finishes.
# 
# ./bin/run_hinec.sh data/ismrm2015/ismrm2015 ismrm2015.mat config/ismrm2015.yml
# 
# Canonical nested schema. Only non-default values appear here;
# everything else comes from nim_config_schema defaults.
# Any parameter can be overridden on the CLI: --set <path>=<value>

preprocessing:
  # Address ROIs by the names the ISMRM scorer uses. An atlas label and a bundle
  # of the same name are not the same region: JHU label 47 "Uncinate fasciculus R"
  # is 24 voxels on this grid against the ISMRM bundle-density mask's 1503, a Dice
  # of 0.018. The JHU parcellation is preserved as parcellation_mask_jhu.
  bundle_roi_dir: data/ismrm2015/scoring_data_Renauld2023/ROI
  # Field-map (FUGUE) correction, from the challenge README (challenge_data/README.txt):
  # phase direction Y, dwell time 1 ms. Before 2026-09-29 the generic 0.58 ms default
  # was used AND the Hz map reached FUGUE as if rad/s, so ~94% of the simulated
  # distortion stayed in the DWI. Polarity y verified against GT (y- is worse).
  dwell_time: 0.001
  phase_encoding_dir: y

tractography:
  integrator:
    method: rkf45
    tolerance: 0.02
    step_min: 0.02
    step_max: 0.5
  termination:
    angle_max: 225
    max_arc: 600

