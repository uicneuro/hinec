# ismrm2015 — dataset/preprocessing config for the ISMRM 2015 Tractography Challenge.
# Dataset: 2 mm isotropic, 32 dirs, b=1000. Builds the nim via run_hinec.sh; the
# tractography block below is the initial-pass default (mirrors hinec_dti) — iterate/tune
# per experiment with run_tractography.sh on the built nim.
#
# Pair with the data layout in data/ismrm2015/ — see data/ismrm2015/README.md. Scoring with
# scilpy (Renauld 2023) expects streamlines in RAS world (mm); run scripts/hinec_to_trk.py
# --space rasmm after the pipeline finishes.
#
#   ./bin/run_hinec.sh data/ismrm2015/ismrm2015 ismrm2015.mat config/ismrm2015.yml

preprocessing:
  run_denoising: true
  denoise_method: 'dwidenoise'
  run_motion_correction: true
  run_eddy: true
  improve_mask: true
  atlas_type: 'jhu'
  # T1 registration DISABLED here (nim_apply_transforms lacks the inverse MNI->T1 warp
  # needed by nim_parcellation_registered). Tractography is unaffected: tracks live in DWI
  # voxel space and the DWI affine still maps voxel -> RAS world for the scorer.
  t1_available: false
  use_t1_registration: false
  register_to_mni: false

tractography:
  # tracker + direction source
  algorithm: 'hinec'
  field: 'dti'
  # direction shaping — interp_method (spatial kernel) x sel_power (alignment steering); they compose
  interp_method: 'trilinear'   # 'trilinear' | 'cubic'
  sel_power: 16                # trajectory-dependent selectivity (0 = plain interpolation)
  # integrator — numerical stepping scheme
  integration_order: 5         # 1 Euler | 2 RK2 | 4 RK4 | 5 RKF45 (adaptive)
  adaptive_step: true
  rkf_tolerance: 0.02
  step_size: 0.2
  step_min: 0.02
  step_max: 0.5
  # seeding
  seed_density: 8
  # termination
  fa_threshold: 0.10
  termination_fa: 0.10
  angle_thresh: 45
  min_length: 15
  max_steps: 3000
  act_enabled: false
