# HINEC configuration for ISMRM 2015 Tractography Challenge
# Dataset: 2 mm isotropic, 32 dirs, b=1000. T1 provided for registration.
#
# Pair with the data layout in data/ismrm2015/ — see data/ismrm2015/README.md.
# Scoring with scilpy (Renauld 2023) expects streamlines in RAS world (mm)
# coords; run scripts/hinec_to_trk.py --space rasmm after the pipeline finishes.

preprocessing:
  run_denoising: true
  denoise_method: 'dwidenoise'
  run_motion_correction: true
  run_eddy: true
  improve_mask: true
  atlas_type: 'jhu'

  # T1 registration is DISABLED here because nim_apply_transforms does not yet
  # implement the inverse MNI->T1 warp needed by nim_parcellation_registered.
  # Without it, parcellation is less precisely T1-aligned, but tractography is
  # unaffected: tracks live in DWI voxel space and the DWI's intrinsic affine
  # still maps voxel -> RAS world correctly for the scilpy scorer.
  # Re-enable once nim_apply_transforms.m grows the inverse-warp implementation.
  t1_available: false
  use_t1_registration: false
  register_to_mni: false

tractography:
  algorithm: 'hinec'

  # RK4 with trilinear interp — same parameter family as the IronTract preset,
  # which has been validated against tractography challenges.
  integration_order: 4
  interp_method: 'trilinear'
  adaptive_step: false
  step_size: 0.2

  # Dense uniform seeding for whole-brain coverage (ISMRM scoring rewards
  # bundle coverage; sparse seeding hurts).
  seed_density: 4
  seed_strategy: 'uniform'

  # Low FA threshold to reach into challenging bundles (fornix, cingulum,
  # CC ends). Angle 35° is a conservative curvature cap.
  termination_fa: 0.1
  angle_thresh: 35
  max_steps: 1000
  min_length: 20    # mm — ISMRM bundles include short fibers; don't over-filter

  act_enabled: true
  enable_diagnostics: true
