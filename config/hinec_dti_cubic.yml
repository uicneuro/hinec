# HINEC interpolated DTI tractography — CUBIC interpolation + RKF45 adaptive integration.
# The high-precision cubic config: interp_method='cubic' drives the direction through a
# tricubic interpolant. The kernel sets how much of the integrator's formal order is
# reachable: trilinear is C0, cubic is C1, spline is C2 — see docs/CONVERGENCE.md.
# (Formerly high_precision.yml.)
# 
# ./bin/run_tractography.sh hinec_dti_cubic --score
# 
# Canonical nested schema. Only non-default values appear here;
# everything else comes from nim_config_schema defaults.
# Any parameter can be overridden on the CLI: --set <path>=<value>

tractography:
  act: true
  integrator:
    method: rkf45
  interpolation:
    method: cubic
  seeding:
    density: 4
  termination:
    fa_min: 0.2
    angle_max: 175
    max_arc: 160
    min_arc: 45

