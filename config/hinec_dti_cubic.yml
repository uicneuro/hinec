# HINEC interpolated DTI tractography — CUBIC interpolation + RKF45 adaptive integration.
# The high-precision cubic config: interp_method='cubic' drives the direction through a
# tricubic interpolant (sel_power=0 here). Cubic now composes WITH sel_power too — raise
# sel_power to combine trajectory-dependent selection with cubic interpolation.
# (Formerly high_precision.yml.)
#
#   ./bin/run_tractography.sh hinec_dti_cubic --score

preprocessing:
  denoise_method: 'dwidenoise'

tractography:
  # tracker + direction source
  algorithm: 'hinec'
  field: 'dti'
  # direction shaping — interp_method (spatial kernel) x sel_power (alignment steering); they compose
  interp_method: 'cubic'       # 'trilinear' | 'cubic'
  sel_power: 0                 # trajectory-dependent selectivity (0 = plain interpolation)
  # integrator — numerical stepping scheme
  integration_order: 5         # 1 Euler | 2 RK2 | 4 RK4 | 5 RKF45 (adaptive)
  adaptive_step: true
  rkf_tolerance: 0.01
  step_size: 0.2
  step_min: 0.01
  step_max: 1.0
  # seeding
  seed_density: 4
  # termination
  fa_threshold: 0.1
  termination_fa: 0.2
  angle_thresh: 35
  min_length: 45
  max_steps: 800
  act_enabled: true
