# HINEC interpolated streamline tractography on the DTI principal-eigenvector field,
# with trajectory-dependent (sel_power) directional interpolation + RK4/RKF45 + ACT.
#
#   ./bin/run_tractography.sh hinec_dti --score
#
# (This is the tracker that used to be mislabelled 'mmf' with integrator: 'rkf45'.
#  For the genuine connection-form Method of Moving Frames, use mmf_dti.yml.)

preprocessing:
  denoise_method: 'dwidenoise'

tractography:
  # tracker + direction source
  algorithm: 'hinec'
  field: 'dti'
  # direction shaping — interp_method (spatial kernel) x sel_power (alignment steering); they compose
  interp_method: 'trilinear'   # 'trilinear' | 'cubic'
  sel_power: 16                # trajectory-dependent selectivity (0 = plain interpolation)
  # integrator — numerical stepping scheme
  integration_order: 5         # 1 Euler | 2 RK2 | 4 RK4 | 5 RKF45 (adaptive)
  adaptive_step: true
  rkf_tolerance: 0.02
  step_size: 0.2
  step_min: 0.02
  step_max: 0.5
  # seeding
  seed_density: 8
  # termination
  fa_threshold: 0.10
  termination_fa: 0.10
  angle_thresh: 45
  min_length: 15
  max_steps: 3000
  act_enabled: false
