# Moving frames tractography (advanceFrame) on the DTI principal-eigenvector field:
# the fibre carries an orthonormal frame that is transported by the connection
# of the data with the closed-form exponential step (exact where the curvature is
# constant along the fibre), CF4 (integrator rk4 -> Lie group order 4), adaptive
# re-anchoring to the data where the carried heading drifts. See
# docs/MMF_TRACTOGRAPHY.md.
#
# ./bin/run_tractography.sh mmf_dti --score
#
# Canonical nested schema. Only non-default values appear here;
# everything else comes from nim_config_schema defaults.
# Any parameter can be overridden on the CLI: --set <path>=<value>

tractography:
  algorithm: mmf
  integrator:
    method: rk4
    step: 0.2
  interpolation:
    method: spline        # C2 kernel: the connection is a derivative of the field
  termination:
    angle_max: 225
    max_arc: 600
  mmf:
    mode: adaptive
    reanchor_tol: 0.001
