# irontract — dataset/preprocessing config for the IronTract Challenge phantom.
# Builds the nim via run_hinec.sh; the tractography block mirrors hinec_dti (initial pass) —
# iterate/tune per experiment with run_tractography.sh on the built nim. See
# docs/IRONTRACT_WORKFLOW.md (nim_irontract_submit packages the submission).
# 
# ./bin/run_hinec.sh <data_prefix> irontract.mat config/irontract.yml
# 
# Canonical nested schema. Only non-default values appear here;
# everything else comes from nim_config_schema defaults.
# Any parameter can be overridden on the CLI: --set <path>=<value>

tractography:
  integrator:
    method: rkf45
    tolerance: 0.02
    step_min: 0.02
    step_max: 0.5
  termination:
    angle_max: 225
    max_arc: 600

