# HINEC IronTract Challenge Configuration
# Optimized for IronTract phantom validation
# Based on successful ISMRM submission parameters

preprocessing:
  run_denoising: true
  denoise_method: 'dwidenoise'
  run_motion_correction: true
  run_eddy: true
  improve_mask: true
  atlas_type: 'jhu'

tractography:
  algorithm: 'hinec'

  # RK4 integration (proven effective for IronTract)
  integration_order: 4
  interp_method: 'trilinear'
  adaptive_step: false
  step_size: 0.2

  # Dense uniform seeding
  seed_density: 4
  seed_strategy: 'uniform'

  # IronTract-optimized termination criteria
  termination_fa: 0.1     # Low threshold for complete tracking
  angle_thresh: 35        # Balanced curvature constraint
  max_steps: 1000
  min_length: 35

  # ACT enabled
  act_enabled: true
  enable_diagnostics: true
