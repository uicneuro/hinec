# HINEC High Precision Configuration
# Same as hinec_default.yml but with RKF45 adaptive integration (order 5)
# For maximum accuracy with adaptive step size control
# Expected runtime: 1.5-2x slower than default

preprocessing:
  run_denoising: true
  denoise_method: "dwidenoise"
  run_motion_correction: true
  run_eddy: true
  improve_mask: true
  atlas_type: "jhu"
  t1_available: false
  use_t1_registration: false
  register_to_mni: false

tractography:
  # Algorithm selection
  algorithm: "hinec" # Options: 'standard' (FACT), 'hinec' (high-order)

  # Integration method
  integration_order: 5 # 1=Euler, 2=RK2, 4=RK4, 5=RKF45
  interp_method: "cubic" # Options: 'trilinear', 'cubic', 'none'

  # Step size control
  step_size: 0.2 # Fixed step size in voxel units

  # RKF45 adaptive stepping (only when integration_order=5)
  adaptive_step: false
  rkf_tolerance: 0.01 # Error tolerance in voxels
  rkf_safety: 0.9 # Safety factor for step adjustment
  step_min: 0.01 # Minimum step size (voxels)
  step_max: 1.0 # Maximum step size (voxels)

  # Seeding parameters
  seed_density: 4 # Seeds per voxel (1-8 recommended)
  seed_strategy: "uniform" # Options: 'uniform'

  # Termination criteria
  termination_fa: 0.2 # FA threshold for track termination
  angle_thresh: 35 # Maximum curvature angle (degrees)
  max_steps: 800 # Maximum integration steps per track
  min_length: 45 # Minimum track length (mm)

  # Anatomically Constrained Tractography (ACT)
  act_enabled: true # Enable ACT if tissue masks available

  # Advanced options
  enable_diagnostics: true
