# HINEC High Precision Configuration
# Same as hinec_default.yml but with RKF45 adaptive integration (order 5)
# For maximum accuracy with adaptive step size control
# Expected runtime: 1.5-2x slower than default

preprocessing:
  run_denoising: true
  denoise_method: "dwidenoise"
  run_motion_correction: true
  run_eddy: true
  improve_mask: true
  atlas_type: "jhu"
  t1_available: false
  use_t1_registration: false
  register_to_mni: false

tractography:
  algorithm: "hinec"

  # RKF45 adaptive integration (only difference from default)
  integration_order: 5
  interp_method: "cubic"

  # Step size control
  step_size: 0.2

  # RKF45 adaptive stepping
  adaptive_step: false
  rkf_tolerance: 0.01
  rkf_safety: 0.9
  step_min: 0.01
  step_max: 1.0

  # Seeding parameters
  seed_density: 4
  seed_strategy: "uniform"

  # Termination criteria
  termination_fa: 0.15
  angle_thresh: 45
  max_steps: 1000
  min_length: 35

  # ACT
  act_enabled: true
  enable_diagnostics: true
