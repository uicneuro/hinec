# HINEC interpolated streamline tractography on the CSD FOD field.
# HINEC supports FOD peaks: nearest-peak selection by incoming tangent resolves
# crossings by approach direction, integrated with RK4/RKF45 + ACT. runTractography
# computes/loads the FOD peaks (nim_csd) before tracking, cached as <source>_csd.mat.
# 
# ./bin/run_tractography.sh hinec_csd --score
# 
# (This is the tracker that used to be mislabelled 'mmf' with integrator: 'rkf45'.)
# 
# Canonical nested schema. Only non-default values appear here;
# everything else comes from nim_config_schema defaults.
# Any parameter can be overridden on the CLI: --set <path>=<value>

tractography:
  field: csd
  integrator:
    method: rkf45
    tolerance: 0.02
    step_min: 0.02
    step_max: 0.5
  termination:
    angle_max: 225
    max_arc: 600

