# MMF-4s: moving frames tractography (advanceFrame) on the DTI principal-eigenvector
# field that marches its connection through degenerate data. The fibre carries an
# orthonormal frame transported by the connection of the data with the closed-form
# exponential step, CF4 (integrator rk4 -> Lie group order 4), re-anchored to the data
# where the carried heading drifts. Where the tensor is a crossing fitted as a pancake
# the tract coasts instead of reading the data: the curvature and the fan-out of its
# last trusted nodes are carried through the zone by the flatness law of the
# connection, exact on circles, logarithmic spirals and rays, and turning the curvature
# by the torsion on a helix. See docs/MMF_TRACTOGRAPHY.md.
#
# ./bin/run_tractography.sh mmf_dti_march --score
#
# Canonical nested schema. Only non-default values appear here;
# everything else comes from nim_config_schema defaults.
# Any parameter can be overridden on the CLI: --set <path>=<value>

tractography:
  algorithm: mmf
  integrator:
    method: rk4
    step: 0.2
  interpolation:
    method: spline        # C2 kernel: the connection is a derivative of the field
  termination:
    angle_max: 0          # off. There is no exit test (mmf.exit_tol is obsolete since 2026-11-23), so
                          # nothing tests the direction on leaving the zone here; set angle_max for a test
                          # (mmf.exit_tol 0.5 gave the docs' scores)
    max_arc: 600
  mmf:
    mode: adaptive
    reanchor_tol: 0.2
    hold: march
