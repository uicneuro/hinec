# HINEC Max Coverage Configuration
# Tests the OL/OR diagnosis: HINEC is overlap-limited (OL 0.27) with huge
# overreach headroom (OR 0.11 vs SOTA's 0.60). This config deliberately trades
# precision for coverage to push recall up, while keeping the strongest
# deterministic integrator (RKF45). Same model (single-tensor) and same
# determinism — only the tracking aggressiveness changes vs high_precision.

preprocessing:
  run_denoising: true
  denoise_method: "dwidenoise"
  run_motion_correction: true
  run_eddy: true
  improve_mask: true
  atlas_type: "jhu"
  t1_available: false
  use_t1_registration: false
  register_to_mni: false

tractography:
  algorithm: "hinec"

  # Keep the best deterministic integrator (RKF45 gave +34% over RK4)
  integration_order: 5
  interp_method: "cubic"
  step_size: 0.2
  adaptive_step: true
  rkf_tolerance: 0.01
  rkf_safety: 0.9
  step_min: 0.01
  step_max: 1.0

  # COVERAGE PUSH #1: densest seeding (more streamlines reaching each bundle)
  seed_density: 8
  seed_strategy: "uniform"

  # COVERAGE PUSH #2: aggressive termination — follow fibers into low-FA
  # regions and around sharp curves; don't discard short valid fibers.
  termination_fa: 0.05   # was 0.2 — reach deep into low-anisotropy tissue
  angle_thresh: 60       # was 35 — allow curved bundles (cingulum, fornix)
  max_steps: 1500        # was 800 — let long fibers complete
  min_length: 15         # was 45 — keep short valid fibers (CA, CP, commissures)

  # ACT off: it was neutral on this phantom and adds termination constraints
  act_enabled: false

  enable_diagnostics: true
