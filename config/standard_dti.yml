# standard_dti — FACT baseline (Fiber Assignment by Continuous Tracking), DTI-only.
# algorithm: 'standard' = discrete voxel tracking, no interpolation, Euler stepping.
# The deterministic sanity-check baseline; faster and coarser than hinec/mmf.
# There is no CSD variant — FACT is DTI-only by construction.
# 
# ./bin/run_tractography.sh standard_dti --score
# 
# Canonical nested schema. Only non-default values appear here;
# everything else comes from nim_config_schema defaults.
# Any parameter can be overridden on the CLI: --set <path>=<value>

tractography:
  algorithm: standard
  act: true
  integrator:
    method: euler
    step: 0.5
  seeding:
    density: 4
  termination:
    angle_max: 45          # deg per voxel transition. FACT is piecewise constant
                           # per voxel, so this is the classic FACT turning angle.
                           # NOT 120: tangents are sign-aligned, so anything >= 90
                           # can never fire (see nim_angle_limit).
    max_arc: 2500
    min_arc: 20

